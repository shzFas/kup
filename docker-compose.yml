# kup — full local stack. Everything is self-hosted; nothing calls third-party services.
#   cp .env.example .env && docker compose up -d --build
# Public entry points: gateway http://localhost:8180, web http://localhost:3180
name: kup

x-go-service: &go-service
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "/app", "healthcheck"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 10s
  deploy:
    resources:
      limits: { memory: 256m }
  networks: [internal]

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth-dev}
      LISTINGS_DB_PASSWORD: ${LISTINGS_DB_PASSWORD:-listings-dev}
      NOTIFY_DB_PASSWORD: ${NOTIFY_DB_PASSWORD:-notify-dev}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:-chat-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
    deploy:
      resources:
        limits: { memory: 1g }
    networks: [internal]

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes: [natsdata:/data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      retries: 20
    deploy:
      resources:
        limits: { memory: 256m }
    networks: [internal]

  meilisearch:
    image: getmeili/meilisearch:v1.15
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-meili-master-key-change-me}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes: [meilidata:/meili_data]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:7700/health"]
      interval: 5s
      retries: 20
    deploy:
      resources:
        limits: { memory: 1g }
    networks: [internal]

  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint-kup.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kup}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dev-s3-secret-change-me}
      S3_BUCKET: media
    volumes:
      - s3data:/data
      - ./deploy/seaweedfs/entrypoint.sh:/entrypoint-kup.sh:ro
    deploy:
      resources:
        limits: { memory: 512m }
    networks: [internal]

  catalog:
    <<: *go-service
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: catalog } }
    image: kup/catalog
    environment:
      ADDR: ":8082"
    deploy:
      resources:
        limits: { memory: 64m }

  auth:
    <<: *go-service
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: auth } }
    image: kup/auth
    environment:
      ADDR: ":8081"
      DATABASE_URL: postgres://auth_svc:${AUTH_DB_PASSWORD:-auth-dev}@postgres:5432/kup_auth?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-32-bytes-min}
      OTP_DEV_MODE: ${OTP_DEV_MODE:-true}
      ADMIN_PHONES: ${ADMIN_PHONES:-+420777000099}
    depends_on:
      postgres: { condition: service_healthy }

  listings:
    <<: *go-service
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: listings } }
    image: kup/listings
    environment:
      ADDR: ":8083"
      DATABASE_URL: postgres://listings_svc:${LISTINGS_DB_PASSWORD:-listings-dev}@postgres:5432/kup_listings?sslmode=disable
      NATS_URL: nats://nats:4222
      CATALOG_URL: http://catalog:8082
      AUTH_URL: http://auth:8081
      S3_ENDPOINT: seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kup}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dev-s3-secret-change-me}
      S3_BUCKET: media
      CURRENCY: CZK
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      seaweedfs: { condition: service_started }
      catalog: { condition: service_healthy }
      auth: { condition: service_healthy }

  search:
    <<: *go-service
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: search } }
    image: kup/search
    environment:
      ADDR: ":8084"
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-meili-master-key-change-me}
      NATS_URL: nats://nats:4222
      CATALOG_URL: http://catalog:8082
      LISTINGS_URL: http://listings:8083
    depends_on:
      meilisearch: { condition: service_healthy }
      nats: { condition: service_healthy }
      catalog: { condition: service_healthy }

  notify:
    <<: *go-service
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: notify } }
    image: kup/notify
    environment:
      ADDR: ":8085"
      DATABASE_URL: postgres://notify_svc:${NOTIFY_DB_PASSWORD:-notify-dev}@postgres:5432/kup_notify?sslmode=disable
      NATS_URL: nats://nats:4222
      CATALOG_URL: http://catalog:8082
      AUTH_URL: http://auth:8081
      LISTINGS_URL: http://listings:8083
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      catalog: { condition: service_healthy }
      listings: { condition: service_healthy }

  chat:
    <<: *go-service
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: chat } }
    image: kup/chat
    environment:
      ADDR: ":8086"
      DATABASE_URL: postgres://chat_svc:${CHAT_DB_PASSWORD:-chat-dev}@postgres:5432/kup_chat?sslmode=disable
      NATS_URL: nats://nats:4222
      AUTH_URL: http://auth:8081
      LISTINGS_URL: http://listings:8083
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      listings: { condition: service_healthy }

  gateway:
    <<: *go-service
    build: { context: ./backend, dockerfile: Dockerfile, args: { SERVICE: gateway } }
    image: kup/gateway
    environment:
      ADDR: ":8080"
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-32-bytes-min}
      AUTH_URL: http://auth:8081
      CATALOG_URL: http://catalog:8082
      LISTINGS_URL: http://listings:8083
      SEARCH_URL: http://search:8084
      NOTIFY_URL: http://notify:8085
      CHAT_URL: http://chat:8086
      S3_URL: http://seaweedfs:8333
      S3_BUCKET: media
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports: ["8180:8080"]
    depends_on:
      auth: { condition: service_healthy }
      catalog: { condition: service_healthy }
      listings: { condition: service_healthy }
      search: { condition: service_healthy }
      notify: { condition: service_healthy }
      chat: { condition: service_healthy }
    networks: [internal, public]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8180}
    image: kup/web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://gateway:8080
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["3180:3180"]
    depends_on:
      gateway: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512m }
    networks: [internal, public]

networks:
  internal:
    internal: true  # no egress: containers cannot reach the internet
  public: {}

volumes:
  pgdata:
  natsdata:
  meilidata:
  s3data:
